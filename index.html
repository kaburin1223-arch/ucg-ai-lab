<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2c"><title>UCG AI LAB - 初手シミュレーター</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1321;color:#e7f0ff}*{box-sizing:border-box}body{margin:0;padding:22px 16px 60px;max-width:720px;margin-inline:auto}h1{font-size:26px;margin:0}small,.muted{color:#9cabc1}header{margin:12px 0 24px}.tag{font-size:12px;background:#173e46;color:#a9ffe5;padding:5px 9px;border-radius:20px}.panel{border:1px solid #324259;border-radius:16px;background:#142135;padding:16px;margin:13px 0}h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:14px;margin:12px 0 6px}select,input,button{font:inherit;border-radius:10px;padding:12px}select,input{width:100%;background:#0d1829;color:#fff;border:1px solid #3c506b}button{background:#55d6bd;color:#071925;border:0;font-weight:750;cursor:pointer;width:100%}button:active{opacity:.8}.ghost{background:#25364e;color:#dbe7f8;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#1d3047;border:1px solid #3e6380;border-radius:9px;padding:11px;min-height:100px}.card strong{font-size:12px;color:#9bbdff}.card p{font-size:14px;margin:7px 0}.card em{font-size:12px;color:#b3c7da}.stats{display:flex;gap:12px;flex-wrap:wrap}.pill{background:#23394f;padding:8px 12px;border-radius:30px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6}a{color:#8fceff}</style></head><body><header><span class="tag">MVP v0.1 — AI・ルール処理未実装</span><h1>UCG AI LAB</h1><p class="muted">iPhone対応・固定デッキの初手抽選テスト</p></header><section class="panel"><h2>デッキと抽選設定</h2><label for="deck">使用デッキ</label><select id="deck"><option value="SD01">SD01 超時空の英雄たち</option><option value="SD02">SD02 零のキズナ</option></select><label for="seed">乱数シード（数字）</label><input id="seed" type="number" value="12345"><p class="muted" style="font-size:12px">同じデッキ・シードなら同じ6枚を再現できます。これは初手抽選の検証用で、最適手分析ではありません。</p><button id="draw">50枚をシャッフルして6枚引く</button><button id="next" class="ghost">別シードでもう一度</button></section><section class="panel"><h2>初手6枚</h2><div class="stats"><span class="pill" id="remaining">山札：44枚</span><span class="pill" id="total">構築：50枚</span></div><div id="cards" class="cards" style="margin-top:14px"></div></section><section class="panel"><h2>デッキ収録内容</h2><pre id="contents"></pre></section><section class="panel"><h2>現在の実装範囲</h2><p>✅ SD01・SD02のカード番号と収録枚数</p><p>✅ 再現可能な初手シャッフル・6枚ドロー</p><p>⏳ レベル・BP・カード効果の正規化／確認</p><p>⏳ 引き直し・フェイズ・合法手・AI自動対戦</p><p class="muted" style="font-size:12px">収録枚数は提供されたデッキリストに基づきます。画像やカード効果は使用していません。</p></section><script>
const raw={SD01:[['001','ウルトラマンダイナ フラッシュタイプ',3],['002','ウルトラマンティガ マルチタイプ',3],['003','ウルトラマンガイア V2',3],['004','ウルトラマンティガ マルチタイプ',4],['005','ウルトラマンティガ マルチタイプ',4],['006','ウルトラマンティガ ゼペリオン光線',3],['007','ウルトラマンダイナ フラッシュタイプ',4],['008','ウルトラマンダイナ フラッシュタイプ',4],['009','ウルトラマンダイナ ソルジェント光線',3],['010','ウルトラマンガイア V2',4],['011','ウルトラマンガイア フォトンエッジ',4],['012','巨大異形獣 サタンビゾー',3],['013','最強合体獣 キングオブモンス',4],['014','超時空の大決戦（シーン）',4]],SD02:[['001','ウルトラマンゼット アルファエッジ',3],['002','ウルトラマンゼロ ウルトラゼロマント',3],['003','ウルトラマンジード ギャラクシーライジング',3],['004','ウルトラマンゼロ ウルトラゼロマント',4],['005','ウルトラマンゼロ エメリウムスラッシュ',4],['006','ウルトラマンゼロ ワイドゼロショット',3],['007','ウルトラマンジード ギャラクシーライジング',4],['008','ウルトラマンジード ギャラクシーバースト',4],['009','ウルトラマンジード レッキングフェニックス',3],['010','ウルトラマンゼット ゼットスラッガー',4],['011','ウルトラマンゼット ゼットランスアロー',4],['012','ベリアル融合獣 スカルゴモラ',3],['013','ベリアル融合獣 ペダニウムゼットン',4],['014','陛下のメダル（シーン）',4]]};
function random(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296}}
function draw(){const deckKey=document.querySelector('#deck').value,items=raw[deckKey],seed=Number(document.querySelector('#seed').value)||0,rand=random(seed),list=items.flatMap(([id,name,count])=>Array.from({length:count},()=>({id:deckKey+'-'+id,name})));if(list.length!==50){alert('デッキが50枚ではありません');return}for(let i=list.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[list[i],list[j]]=[list[j],list[i]]}const hand=list.slice(0,6);document.querySelector('#cards').replaceChildren(...hand.map(card=>{const el=document.createElement('div');el.className='card';const id=document.createElement('strong'),name=document.createElement('p');id.textContent=card.id;name.textContent=card.name;el.append(id,name);return el}));document.querySelector('#contents').textContent=items.map(([id,name,count])=>`${deckKey}-${id}  ×${count}  ${name}`).join('\n');document.querySelector('#remaining').textContent='山札：'+(list.length-6)+'枚';document.querySelector('#total').textContent='構築：'+list.length+'枚'}document.querySelector('#draw').addEventListener('click',draw);document.querySelector('#next').addEventListener('click',()=>{const s=document.querySelector('#seed');s.value=(Number(s.value)||0)+1;draw()});document.querySelector('#deck').addEventListener('change',draw);draw();
</script></body></html>
